name: Test ACL Model

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenFGA
        id: setup
        uses: ./.github/actions/setup-openfga

      - name: Run unit tests
        env:
          FGA_API_URL: http://localhost:8080
          FGA_STORE_ID: ${{ steps.setup.outputs.store_id }}
          FGA_MODEL_ID: ${{ steps.setup.outputs.model_id }}
        run: npm test

  bdd-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenFGA
        id: setup
        uses: ./.github/actions/setup-openfga

      - name: Run BDD tests
        env:
          FGA_API_URL: http://localhost:8080
          FGA_STORE_ID: ${{ steps.setup.outputs.store_id }}
          FGA_MODEL_ID: ${{ steps.setup.outputs.model_id }}
        run: npm run test:bdd
