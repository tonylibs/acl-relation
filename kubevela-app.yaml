apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: openfga
  namespace: default
spec:
  components:
    # --- PostgreSQL datastore ---
    - name: postgres
      type: webservice
      properties:
        image: postgres:16-alpine
        ports:
          - port: 5432
            expose: true
        env:
          - name: POSTGRES_USER
            value: openfga
          - name: POSTGRES_PASSWORD
            value: openfga
          - name: POSTGRES_DB
            value: openfga
      traits:
        - type: storage
          properties:
            pvc:
              - name: postgres-data
                mountPath: /var/lib/postgresql/data
                subPath: pgdata
                resources:
                  requests:
                    storage: 1Gi

    # --- OpenFGA database migration (runs before server starts) ---
    - name: openfga-migrate
      type: k8s-objects
      properties:
        objects:
          - apiVersion: batch/v1
            kind: Job
            metadata:
              name: openfga-migrate
            spec:
              backoffLimit: 5
              template:
                spec:
                  restartPolicy: OnFailure
                  initContainers:
                    - name: wait-for-postgres
                      image: busybox:1.36
                      command:
                        - sh
                        - -c
                        - |
                          echo "Waiting for PostgreSQL..."
                          until nc -z postgres 5432; do
                            echo "  postgres not ready, retrying in 2s..."
                            sleep 2
                          done
                          echo "PostgreSQL is reachable."
                  containers:
                    - name: migrate
                      image: openfga/openfga:latest
                      command:
                        - migrate
                      env:
                        - name: OPENFGA_DATASTORE_ENGINE
                          value: postgres
                        - name: OPENFGA_DATASTORE_URI
                          value: postgres://openfga:openfga@postgres:5432/openfga?sslmode=disable

    # --- OpenFGA server ---
    - name: openfga
      type: webservice
      dependsOn:
        - postgres
      properties:
        image: openfga/openfga:latest
        cmd:
          - run
        ports:
          - port: 8080
            expose: true
          - port: 8081
            expose: true
          - port: 3000
            expose: true
        env:
          - name: OPENFGA_DATASTORE_ENGINE
            value: postgres
          - name: OPENFGA_DATASTORE_URI
            value: postgres://openfga:openfga@postgres:5432/openfga?sslmode=disable
          - name: OPENFGA_PLAYGROUND_ENABLED
            value: "true"
      traits:
        - type: scaler
          properties:
            replicas: 1

    # --- ConfigMap with the authorization model JSON ---
    - name: openfga-model-config
      type: k8s-objects
      properties:
        objects:
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: openfga-model
            data:
              model.json: |
                {
                  "schema_version": "1.1",
                  "type_definitions": [
                    {
                      "type": "user"
                    },
                    {
                      "type": "role",
                      "relations": {
                        "assignee": {
                          "this": {}
                        }
                      },
                      "metadata": {
                        "relations": {
                          "assignee": {
                            "directly_related_user_types": [
                              { "type": "user" }
                            ]
                          }
                        }
                      }
                    },
                    {
                      "type": "permission",
                      "relations": {
                        "role": {
                          "this": {}
                        },
                        "parent": {
                          "this": {}
                        },
                        "can_access": {
                          "union": {
                            "child": [
                              {
                                "tupleToUserset": {
                                  "tupleset": {
                                    "relation": "role"
                                  },
                                  "computedUserset": {
                                    "relation": "assignee"
                                  }
                                }
                              },
                              {
                                "tupleToUserset": {
                                  "tupleset": {
                                    "relation": "parent"
                                  },
                                  "computedUserset": {
                                    "relation": "can_access"
                                  }
                                }
                              }
                            ]
                          }
                        }
                      },
                      "metadata": {
                        "relations": {
                          "role": {
                            "directly_related_user_types": [
                              { "type": "role" }
                            ]
                          },
                          "parent": {
                            "directly_related_user_types": [
                              { "type": "permission" }
                            ]
                          }
                        }
                      }
                    }
                  ]
                }

    # --- Job to create a store and write the authorization model ---
    - name: openfga-write-schema
      type: k8s-objects
      dependsOn:
        - openfga
        - openfga-model-config
      properties:
        objects:
          - apiVersion: batch/v1
            kind: Job
            metadata:
              name: openfga-write-schema
            spec:
              backoffLimit: 3
              template:
                spec:
                  restartPolicy: OnFailure
                  volumes:
                    - name: model-config
                      configMap:
                        name: openfga-model
                  containers:
                    - name: write-schema
                      image: curlimages/curl:latest
                      volumeMounts:
                        - name: model-config
                          mountPath: /config
                      command:
                        - sh
                        - -c
                        - |
                          set -e
                          OPENFGA_API_URL="http://openfga:8080"

                          echo "Waiting for OpenFGA to be ready..."
                          until curl -sf "${OPENFGA_API_URL}/healthz" > /dev/null 2>&1; do
                            echo "  OpenFGA not ready, retrying in 3s..."
                            sleep 3
                          done
                          echo "OpenFGA is ready."

                          echo "Creating store..."
                          STORE_RESPONSE=$(curl -sf -X POST "${OPENFGA_API_URL}/stores" \
                            -H "Content-Type: application/json" \
                            -d '{"name": "acl-store"}')

                          STORE_ID=$(echo "${STORE_RESPONSE}" | sed 's/.*"id":"\([^"]*\)".*/\1/')

                          if [ -z "${STORE_ID}" ]; then
                            echo "ERROR: Failed to create store. Response: ${STORE_RESPONSE}"
                            exit 1
                          fi
                          echo "Store created: ${STORE_ID}"

                          echo "Writing authorization model..."
                          MODEL_RESPONSE=$(curl -sf -X POST \
                            "${OPENFGA_API_URL}/stores/${STORE_ID}/authorization-models" \
                            -H "Content-Type: application/json" \
                            -d @/config/model.json)

                          MODEL_ID=$(echo "${MODEL_RESPONSE}" | sed 's/.*"authorization_model_id":"\([^"]*\)".*/\1/')

                          if [ -z "${MODEL_ID}" ]; then
                            echo "ERROR: Failed to write model. Response: ${MODEL_RESPONSE}"
                            exit 1
                          fi

                          echo "Authorization model written successfully."
                          echo "  Store ID: ${STORE_ID}"
                          echo "  Model ID: ${MODEL_ID}"

  # --- Workflow: ensure ordered deployment ---
  workflow:
    steps:
      - name: deploy-datastore
        type: apply-component
        properties:
          component: postgres

      - name: run-migrations
        type: apply-component
        dependsOn:
          - deploy-datastore
        properties:
          component: openfga-migrate

      - name: deploy-openfga
        type: apply-component
        dependsOn:
          - run-migrations
        properties:
          component: openfga

      - name: deploy-model-config
        type: apply-component
        dependsOn:
          - deploy-openfga
        properties:
          component: openfga-model-config

      - name: write-schema
        type: apply-component
        dependsOn:
          - deploy-model-config
        properties:
          component: openfga-write-schema
