apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: openfga
  namespace: default
spec:
  components:
    # --- PostgreSQL datastore ---
    - name: postgres
      type: webservice
      properties:
        image: postgres:16-alpine
        ports:
          - port: 5432
            expose: true
        env:
          - name: POSTGRES_USER
            value: openfga
          - name: POSTGRES_PASSWORD
            value: openfga
          - name: POSTGRES_DB
            value: openfga
      traits:
        - type: storage
          properties:
            pvc:
              - name: postgres-data
                mountPath: /var/lib/postgresql/data
                subPath: pgdata
                resources:
                  requests:
                    storage: 1Gi

    # --- OpenFGA database migration (runs before server starts) ---
    - name: openfga-migrate
      type: k8s-objects
      properties:
        objects:
          - apiVersion: batch/v1
            kind: Job
            metadata:
              name: openfga-migrate
            spec:
              backoffLimit: 5
              template:
                spec:
                  restartPolicy: OnFailure
                  initContainers:
                    - name: wait-for-postgres
                      image: busybox:1.36
                      command:
                        - sh
                        - -c
                        - |
                          echo "Waiting for PostgreSQL..."
                          until nc -z postgres 5432; do
                            echo "  postgres not ready, retrying in 2s..."
                            sleep 2
                          done
                          echo "PostgreSQL is reachable."
                  containers:
                    - name: migrate
                      image: openfga/openfga:latest
                      command:
                        - migrate
                      env:
                        - name: OPENFGA_DATASTORE_ENGINE
                          value: postgres
                        - name: OPENFGA_DATASTORE_URI
                          value: postgres://openfga:openfga@postgres:5432/openfga?sslmode=disable

    # --- OpenFGA server ---
    - name: openfga
      type: webservice
      dependsOn:
        - postgres
      properties:
        image: openfga/openfga:latest
        cmd:
          - run
        ports:
          - port: 8080
            expose: true
          - port: 8081
            expose: true
          - port: 3000
            expose: true
        env:
          - name: OPENFGA_DATASTORE_ENGINE
            value: postgres
          - name: OPENFGA_DATASTORE_URI
            value: postgres://openfga:openfga@postgres:5432/openfga?sslmode=disable
          - name: OPENFGA_PLAYGROUND_ENABLED
            value: "true"
      traits:
        - type: scaler
          properties:
            replicas: 1

    # --- ConfigMap with the authorization model DSL ---
    - name: openfga-model-config
      type: k8s-objects
      properties:
        objects:
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: openfga-model
            data:
              model.fga: |
                model
                  schema 1.1

                type user

                type role
                  relations
                    define assignee: [user]

                type permission
                  relations
                    define role: [role]
                    define parent: [permission]
                    define can_access: assignee from role or can_access from parent

    # --- Job to create a store and write the authorization model via FGA CLI ---
    - name: openfga-write-schema
      type: k8s-objects
      dependsOn:
        - openfga
        - openfga-model-config
      properties:
        objects:
          - apiVersion: batch/v1
            kind: Job
            metadata:
              name: openfga-write-schema
            spec:
              backoffLimit: 3
              template:
                spec:
                  restartPolicy: OnFailure
                  volumes:
                    - name: model-config
                      configMap:
                        name: openfga-model
                  containers:
                    - name: write-schema
                      image: openfga/cli:latest
                      volumeMounts:
                        - name: model-config
                          mountPath: /config
                      env:
                        - name: FGA_API_URL
                          value: http://openfga:8080
                      command:
                        - sh
                        - -c
                        - |
                          set -e

                          echo "Waiting for OpenFGA to be ready..."
                          until fga store list 2>/dev/null; do
                            echo "  OpenFGA not ready, retrying in 3s..."
                            sleep 3
                          done
                          echo "OpenFGA is ready."

                          echo "Creating store and writing model..."
                          fga store create --name acl-store --model /config/model.fga

                          echo "Store created and authorization model written successfully."

  # --- Workflow: ensure ordered deployment ---
  workflow:
    steps:
      - name: deploy-datastore
        type: apply-component
        properties:
          component: postgres

      - name: run-migrations
        type: apply-component
        dependsOn:
          - deploy-datastore
        properties:
          component: openfga-migrate

      - name: deploy-openfga
        type: apply-component
        dependsOn:
          - run-migrations
        properties:
          component: openfga

      - name: deploy-model-config
        type: apply-component
        dependsOn:
          - deploy-openfga
        properties:
          component: openfga-model-config

      - name: write-schema
        type: apply-component
        dependsOn:
          - deploy-model-config
        properties:
          component: openfga-write-schema
