apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: openfga
  namespace: default
spec:
  components:
    # --- OpenFGA via Helm chart (includes PostgreSQL sub-chart and migrations) ---
    - name: openfga
      type: helm
      properties:
        repoType: helm
        url: https://openfga.github.io/helm-charts
        chart: openfga
        values:
          replicaCount: 1
          datastore:
            engine: postgres
            uri: postgres://postgres:openfga@openfga-postgresql:5432/openfga?sslmode=disable
            applyMigrations: true
            waitForMigrations: true
          postgresql:
            enabled: true
            image:
              repository: bitnami/postgresql
              tag: "latest"
            auth:
              postgresPassword: openfga
              database: openfga
            primary:
              persistence:
                enabled: false
          playground:
            enabled: true

    # --- ConfigMap with the authorization model DSL ---
    - name: openfga-model-config
      type: k8s-objects
      properties:
        objects:
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: openfga-model
            data:
              model.fga: |
                model
                  schema 1.1

                type user

                type role
                  relations
                    define assignee: [user]

                type permission
                  relations
                    define role: [role]
                    define parent: [permission]
                    define can_access: assignee from role or can_access from parent

    # --- RBAC for write-schema Job to create ConfigMaps ---
    - name: openfga-rbac
      type: k8s-objects
      properties:
        objects:
          - apiVersion: v1
            kind: ServiceAccount
            metadata:
              name: openfga-schema-writer
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: Role
            metadata:
              name: openfga-configmap-creator
            rules:
              - apiGroups: [""]
                resources: ["configmaps"]
                verbs: ["create", "get"]
          - apiVersion: rbac.authorization.k8s.io/v1
            kind: RoleBinding
            metadata:
              name: openfga-schema-writer-binding
            subjects:
              - kind: ServiceAccount
                name: openfga-schema-writer
            roleRef:
              kind: Role
              name: openfga-configmap-creator
              apiGroup: rbac.authorization.k8s.io

    # --- Job to create a store, write the model, and save IDs to ConfigMap ---
    - name: openfga-write-schema
      type: k8s-objects
      dependsOn:
        - openfga
        - openfga-model-config
        - openfga-rbac
      properties:
        objects:
          - apiVersion: batch/v1
            kind: Job
            metadata:
              name: openfga-write-schema
            spec:
              backoffLimit: 3
              template:
                spec:
                  serviceAccountName: openfga-schema-writer
                  restartPolicy: OnFailure
                  volumes:
                    - name: model-config
                      configMap:
                        name: openfga-model
                    - name: shared
                      emptyDir: {}
                  initContainers:
                    - name: create-store
                      image: openfga/cli:latest
                      volumeMounts:
                        - name: model-config
                          mountPath: /config
                        - name: shared
                          mountPath: /shared
                      env:
                        - name: FGA_API_URL
                          value: http://openfga:8080
                      command: ["/bin/sh", "-c"]
                      args:
                        - |
                          fga store create --name acl-store --model /config/model.fga > /shared/result.json
                          cat /shared/result.json
                  containers:
                    - name: save-ids
                      image: bitnami/kubectl:latest
                      volumeMounts:
                        - name: shared
                          mountPath: /shared
                      command: ["/bin/sh", "-c"]
                      args:
                        - |
                          STORE_ID=$(cat /shared/result.json | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
                          MODEL_ID=$(cat /shared/result.json | grep -o '"authorization_model_id":"[^"]*"' | cut -d'"' -f4)
                          echo "Store ID: $STORE_ID"
                          echo "Model ID: $MODEL_ID"
                          kubectl create configmap acl-resource \
                            --from-literal=FGA_STORE_ID="$STORE_ID" \
                            --from-literal=FGA_MODEL_ID="$MODEL_ID" \
                            --from-literal=FGA_API_URL="http://openfga:8080"

    # --- ConfigMap with the actions YAML ---
    - name: openfga-actions-config
      type: k8s-objects
      properties:
        objects:
          - apiVersion: v1
            kind: ConfigMap
            metadata:
              name: openfga-actions
            data:
              actions.yaml: |
                permissions:
                  - resource: category
                    actions:
                      - name: view
                      - name: create
                        includes:
                          - view
                      - name: edit
                        includes:
                          - view
                      - name: delete
                        includes:
                          - create
                          - edit

                  - resource: invoice
                    actions:
                      - name: view
                      - name: create
                        includes:
                          - view
                      - name: edit
                        includes:
                          - view
                      - name: delete
                        includes:
                          - create
                          - edit

                  - resource: staff
                    actions:
                      - name: view
                      - name: create
                        includes:
                          - view
                      - name: edit
                        includes:
                          - view
                      - name: delete
                        includes:
                          - create
                          - edit

    # --- Job to seed permission tuples from actions.yaml ---
    - name: openfga-seed-actions
      type: k8s-objects
      dependsOn:
        - openfga-write-schema
        - openfga-actions-config
      properties:
        objects:
          - apiVersion: batch/v1
            kind: Job
            metadata:
              name: openfga-seed-actions
            spec:
              backoffLimit: 3
              template:
                spec:
                  restartPolicy: OnFailure
                  volumes:
                    - name: actions-config
                      configMap:
                        name: openfga-actions
                  containers:
                    - name: seed-actions
                      image: <your-org>/acl-seed-actions:latest
                      volumeMounts:
                        - name: actions-config
                          mountPath: /config
                      env:
                        - name: ACTIONS_CONFIG_PATH
                          value: /config/actions.yaml
                        - name: FGA_API_URL
                          valueFrom:
                            configMapKeyRef:
                              name: acl-resource
                              key: FGA_API_URL
                        - name: FGA_STORE_ID
                          valueFrom:
                            configMapKeyRef:
                              name: acl-resource
                              key: FGA_STORE_ID
                        - name: FGA_MODEL_ID
                          valueFrom:
                            configMapKeyRef:
                              name: acl-resource
                              key: FGA_MODEL_ID

  # --- Workflow: ensure ordered deployment ---
  workflow:
    steps:
      - name: deploy-openfga
        type: apply-component
        properties:
          component: openfga

      - name: deploy-model-config
        type: apply-component
        dependsOn:
          - deploy-openfga
        properties:
          component: openfga-model-config

      - name: deploy-rbac
        type: apply-component
        dependsOn:
          - deploy-openfga
        properties:
          component: openfga-rbac

      - name: write-schema
        type: apply-component
        dependsOn:
          - deploy-model-config
          - deploy-rbac
        properties:
          component: openfga-write-schema

      - name: deploy-actions-config
        type: apply-component
        dependsOn:
          - write-schema
        properties:
          component: openfga-actions-config

      - name: seed-actions
        type: apply-component
        dependsOn:
          - deploy-actions-config
        properties:
          component: openfga-seed-actions
